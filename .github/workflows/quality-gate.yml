name: Antigravity Quality Gate & CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: 4-Pillar Quality Gate Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gate 1 - Missing Imports & Identifier Audit
        run: node scripts/check-imports.cjs

      - name: Gate 2 - Linter Verification (Oxlint)
        run: npm run lint

      - name: Gate 3 - Autonomous Unit Test Suite
        run: npm test

      - name: Gate 4 - Production Build & Type Integrity
        run: npm run build
